name: Package Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew*"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "packaging/arch/**"
      - "packaging/windows/**"
      - ".github/workflows/desktop-package.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew*"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "packaging/arch/**"
      - "packaging/windows/**"
      - ".github/workflows/desktop-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            command: ./gradlew :desktop:createDistributable --no-daemon --stacktrace
          - platform: Windows
            runner: windows-latest
            command: .\gradlew.bat :desktop:createDistributable --no-daemon --stacktrace
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up WiX Toolset
        if: matrix.platform == 'Windows'
        uses: wixtoolset/setup-wix@v1

      - name: Create desktop application staging image
        run: ${{ matrix.command }}

      - name: Create thin Linux bundle
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          stage=dist/NCMD-linux-x64
          mkdir -p "$stage/bin" "$stage/lib"
          cp -r desktop/build/compose/binaries/main/app/NCMD/lib/app "$stage/lib/app"
          sed "s/@NCMD_VERSION@/${version}/" packaging/arch/ncmd > "$stage/bin/ncmd"
          chmod 755 "$stage/bin/ncmd"
          tar -C dist -czf "dist/ncmd-${version}-linux-x64.tar.gz" NCMD-linux-x64
          rm -rf "$stage"

      - name: Create thin Windows bundle
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path app/build.gradle.kts -Pattern 'versionName\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $stage = Join-Path $env:RUNNER_TEMP 'NCMD'
          New-Item -ItemType Directory -Force -Path "$stage\lib" | Out-Null
          $appConfig = Get-ChildItem desktop\build\compose\binaries\main\app -Recurse -File -Filter 'NCMD.cfg' |
            Select-Object -First 1
          if (-not $appConfig) { throw 'Compose application configuration was not found.' }
          Copy-Item $appConfig.DirectoryName "$stage\lib\app" -Recurse
          $source = (Get-Content packaging\windows\ncmd_launcher.cpp -Raw).Replace('@NCMD_VERSION@', $version)
          $launcherSource = Join-Path $env:RUNNER_TEMP 'ncmd_launcher.cpp'
          Set-Content -Path $launcherSource -Value $source -NoNewline
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ build tools were not found.' }
          $devCommand = "`"$visualStudio\Common7\Tools\VsDevCmd.bat`" -no_logo -arch=x64 && cl.exe /nologo /std:c++17 /O2 /MT /DUNICODE /D_UNICODE /EHsc `"$launcherSource`" /Fe:`"$stage\NCMD.exe`" /link /SUBSYSTEM:WINDOWS Advapi32.lib Shell32.lib User32.lib"
          cmd.exe /c $devCommand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wixTemp = Join-Path $env:RUNNER_TEMP 'ncmd-wix'
          New-Item -ItemType Directory -Force -Path $wixTemp, dist | Out-Null
          heat.exe dir "$stage" -cg ApplicationFiles -dr INSTALLFOLDER -gg -srd -scom -sreg -out "$wixTemp\NcmdFiles.wxs"
          candle.exe -nologo -dProductVersion=$version -out "$wixTemp\" packaging\windows\NCMD.wxs "$wixTemp\NcmdFiles.wxs"
          light.exe -nologo -out "dist\ncmd-$version-windows-x64.msi" "$wixTemp\NCMD.wixobj" "$wixTemp\NcmdFiles.wixobj"

      - name: Smoke test Linux application startup
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set +e
          NCMD_JAVA_HOME="$JAVA_HOME" \
            NCMD_APP_HOME="$PWD/desktop/build/compose/binaries/main/app/NCMD" \
            timeout --signal=TERM 10s xvfb-run -a bash packaging/arch/ncmd
          status=$?
          if [[ "$status" -ne 124 && "$status" -ne 143 ]]; then
            exit "$status"
          fi

      - name: Upload ${{ matrix.platform }} packages
        uses: actions/upload-artifact@v4
        with:
          name: ncmd-desktop-${{ matrix.platform }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package-arch:
    name: Package Arch Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Desktop app image
        run: ./gradlew :desktop:createDistributable --no-daemon --stacktrace

      - name: Read package version
        id: version
        run: echo "value=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build pacman package in clean Arch container
        env:
          NCMD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm \
            --env NCMD_VERSION \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/packaging/arch \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm
              useradd --create-home builder
              chown -R builder:builder /workspace
              su builder -c "cd /workspace/packaging/arch && NCMD_VERSION=${NCMD_VERSION} makepkg --noconfirm --cleanbuild --nodeps"
              package_file=$(find /workspace/packaging/arch -maxdepth 1 -type f -name 'ncmd-*.pkg.tar.zst' -print -quit)
              test -n "$package_file"
              ! bsdtar -tf "$package_file" | grep -q "^opt/ncmd/lib/runtime/"
            '

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ncmd-desktop-ArchLinux-${{ github.sha }}
          path: packaging/arch/ncmd-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
