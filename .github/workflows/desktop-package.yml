name: Package Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew*"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "packaging/arch/**"
      - ".github/workflows/desktop-package.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew*"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "packaging/arch/**"
      - ".github/workflows/desktop-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            command: ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace
          - platform: Windows
            runner: windows-latest
            command: .\gradlew.bat :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package desktop application
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.platform }} packages
        uses: actions/upload-artifact@v4
        with:
          name: ncmd-desktop-${{ matrix.platform }}-${{ github.sha }}
          path: desktop/build/compose/binaries/main/**
          if-no-files-found: error
          retention-days: 14

  package-arch:
    name: Package Arch Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Desktop app image
        run: ./gradlew :desktop:createDistributable --no-daemon --stacktrace

      - name: Read package version
        id: version
        run: echo "value=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build pacman package in clean Arch container
        env:
          NCMD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm \
            --env NCMD_VERSION \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/packaging/arch \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm
              useradd --create-home builder
              chown -R builder:builder /workspace
              su builder -c "cd /workspace/packaging/arch && NCMD_VERSION=${NCMD_VERSION} makepkg --noconfirm --cleanbuild --nodeps"
            '

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ncmd-desktop-ArchLinux-${{ github.sha }}
          path: packaging/arch/ncmd-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
