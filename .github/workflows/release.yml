name: Publish Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.2.3 or v1.2.3-beta.1"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}

    steps:
      - name: Resolve tag and release channel
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag_name }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
            prerelease=false
            [[ "$tag" == *-* ]] && prerelease=true
          else
            tag="$MANUAL_TAG"
            prerelease="$MANUAL_PRERELEASE"
          fi
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed arm64-v8a APK
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ncmd.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/ncmd.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease -PsplitAbi=true -PabiFilters=arm64-v8a
          --no-daemon --stacktrace

      - name: Package release assets
        id: assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path=$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*release*.apk' -print -quit)
          test -n "$apk_path"
          mkdir -p dist
          apk_name="ncmd-${RELEASE_TAG}-arm64-v8a.apk"
          cp "$apk_path" "dist/$apk_name"
          sha256sum "dist/$apk_name" > "dist/$apk_name.sha256"
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          commit_sha=$(git rev-parse HEAD)
          cat > dist/update.json <<EOF
          {
            "tag": "${RELEASE_TAG}",
            "versionName": "${version_name}",
            "commitSha": "${commit_sha}",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${apk_name}",
            "apkSha256": "$(cut -d ' ' -f 1 "dist/$apk_name.sha256")"
          }
          EOF

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.prepare.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ needs.prepare.outputs.tag }}
          path: dist

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: NCMD ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.sha256
            dist/update.json
